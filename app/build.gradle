plugins {
    id 'com.android.application'
}

// Ícone do Meu Dinheiro.
// O Zip2Git transforma os arquivos em Base64; por isso o próprio Gradle
// recria o arquivo WebP antes da compilação.
def meuDinheiroIconBase64 = ''
def meuDinheiroIconFile = file('src/main/res/drawable/app_icon.webp')
meuDinheiroIconFile.parentFile.mkdirs()
meuDinheiroIconFile.bytes = java.util.Base64.getDecoder().decode(meuDinheiroIconBase64)

android {
    namespace 'com.michael.meudinheiro'
    compileSdk 35

    defaultConfig {
        applicationId 'com.michael.meudinheiro'
        minSdk 26
        targetSdk 35
        versionCode 49
        versionName '0.49'
    }

    signingConfigs {
        release {
            def ksFile = System.getenv("MD_KEYSTORE_FILE")
            def ksPass = System.getenv("MD_KEYSTORE_PASSWORD")
            def ksAlias = System.getenv("MD_KEY_ALIAS")
            def keyPass = System.getenv("MD_KEY_PASSWORD")

            if (ksFile && ksPass && ksAlias && keyPass) {
                storeFile file(ksFile)
                storePassword ksPass
                keyAlias ksAlias
                keyPassword keyPass
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
