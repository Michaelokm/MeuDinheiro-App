name: Build Meu Dinheiro APK

"on":
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Corrigir arquivos enviados pelo Zip2Git
        shell: bash
        run: |
          files=(
            "build.gradle"
            "settings.gradle"
            "gradle.properties"
            "README.txt"
            "README-GITHUB.txt"
            "app/build.gradle"
            "app/proguard-rules.pro"
            "app/src/main/AndroidManifest.xml"
            "app/src/main/assets/index.html"
            "app/src/main/java/com/michael/meudinheiro/MainActivity.java"
            "app/src/main/res/values/styles.xml"
          )

          for f in "${files[@]}"; do
            echo "Decodificando $f"
            base64 --decode "$f" > "$f.tmp"
            mv "$f.tmp" "$f"
          done

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Preparar Android SDK 35
        shell: bash
        run: |
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | head -n 1)"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Preparar e conferir assinatura fixa
        shell: bash
        env:
          KEY_A: ${{ secrets.MD_KEYSTORE_B64_A }}
          KEY_B: ${{ secrets.MD_KEYSTORE_B64_B }}
          KEY_C: ${{ secrets.MD_KEYSTORE_B64_C }}
        run: |
          test -n "$KEY_A" || (echo "MD_KEYSTORE_B64_A não configurado" && exit 1)
          test -n "$KEY_B" || (echo "MD_KEYSTORE_B64_B não configurado" && exit 1)
          test -n "$KEY_C" || (echo "MD_KEYSTORE_B64_C não configurado" && exit 1)

          printf '%s%s%s' "$KEY_A" "$KEY_B" "$KEY_C" | tr -d '\r\n ' | base64 --decode > app/meudinheiro-release.jks

          EXPECTED="d438171044c3754e4ad9e335f68a89cc9061b196f603f31e00504ade6ec337db"
          ACTUAL="$(sha256sum app/meudinheiro-release.jks | awk '{print $1}')"
          echo "SHA256 recebido: $ACTUAL"

          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "ERRO: a chave de assinatura chegou incompleta ou alterada."
            exit 1
          fi

          echo "Chave de assinatura conferida com sucesso."

      - name: Compilar APK assinado
        env:
          MD_KEYSTORE_FILE: meudinheiro-release.jks
          MD_KEYSTORE_PASSWORD: ${{ secrets.MD_KEYSTORE_PASSWORD }}
          MD_KEY_ALIAS: ${{ secrets.MD_KEY_ALIAS }}
          MD_KEY_PASSWORD: ${{ secrets.MD_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease

      - name: Preparar APK
        run: cp app/build/outputs/apk/release/app-release.apk MeuDinheiro-release.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: MeuDinheiro-APK
          path: MeuDinheiro-release.apk

          if-no-files-found: error
