name: Build Meu Dinheiro APK

"on":
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Corrigir arquivos enviados pelo Zip2Git
        shell: bash
        run: |
          files=(
            "build.gradle"
            "settings.gradle"
            "gradle.properties"
            "README.txt"
            "README-GITHUB.txt"
            "app/build.gradle"
            "app/proguard-rules.pro"
            "app/src/main/AndroidManifest.xml"
            "app/src/main/assets/index.html"
            "app/src/main/java/com/michael/meudinheiro/MainActivity.java"
            "app/src/main/res/values/styles.xml"
          )

          for f in "${files[@]}"; do
            echo "Decodificando $f"
            base64 --decode "$f" > "$f.tmp"
            mv "$f.tmp" "$f"
          done

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Compilar APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Preparar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MeuDinheiro-v0.2.1.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: MeuDinheiro-v0.2.1-APK
          path: MeuDinheiro-v0.2.1.apk
          if-no-files-found: error
